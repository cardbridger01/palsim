[package]
name = "format_a_replay"
version = "0.1.0"
edition = "2021"
publish = false

# Same shape as replay/'s own Cargo.toml (see its comment) -- depends on
# both engine and cards for the same reason: apply_event calls real
# cards:: functions, and cards already depends on engine, so engine
# cannot depend back on cards without a cycle.
[dependencies]
engine = { path = "../engine" }
cards = { path = "../cards" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
