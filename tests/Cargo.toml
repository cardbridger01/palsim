[package]
name = "palsim_tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
test = true
doctest = false

# The whole point of Phase 2: this dependency does not exist yet
# (engine/ is Phase 3, per CLAUDE.md's build order). `cargo test` for
# this package MUST fail to compile until it does. See tests/src/lib.rs.
[dependencies]
engine = { path = "../engine" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
